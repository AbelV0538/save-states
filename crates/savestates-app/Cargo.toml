[package]
name = "savestates-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "savestates-app"
path = "src/main.rs"

[dependencies]
savestates-core = { path = "../savestates-core" }
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
chrono.workspace = true
image.workspace = true
# glow (OpenGL) rather than eframe's default wgpu: smaller, and wgpu's DX12 backend fails to build
# here because gpu-allocator unifies with the windows 0.58 that winvd needs.
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "system_fonts", "glow", "clipboard", "accesskit"] }
tray-icon = "0.26"
rfd = "0.17"
